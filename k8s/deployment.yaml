apiVersion: apps/v1
kind: Deployment
metadata:
  name: insurance-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insurance
  template:
    metadata:
      labels:
        app: insurance
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: insurance-secrets
                  key: DATABASE_URL
            - name: PGCONNECT_TIMEOUT
              value: "3"
          command:
            - sh
            - -c
            - |
              until psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'SELECT 1' >/dev/null 2>&1; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      containers:
        - name: api
          image: insurance-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: insurance-config
            - secretRef:
                name: insurance-secrets
          startupProbe:
            httpGet:
              path: /ready
              port: http
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
